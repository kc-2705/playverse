# Render blueprint.
# - playverse-app: the website, a static site. Free static sites never sleep,
#   so the site opens instantly.
# - playverse: the game server (API + Socket.io). On the free plan it sleeps
#   after 15 idle minutes; the website wakes it as soon as someone visits.
services:
  - type: web
    name: playverse
    runtime: node
    plan: free
    # Same area as the MongoDB Atlas cluster (AWS N. Virginia), so database calls stay fast.
    region: virginia
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      # Paste your MongoDB Atlas connection string when Render asks for it.
      - key: MONGO_URL
        sync: false
      # The website's address, so the browser may call this server.
      - key: CLIENT_URL
        fromService:
          name: playverse-app
          type: web
          property: host

  - type: web
    name: playverse-app
    runtime: static
    buildCommand: npm ci --prefix client --include=dev && npm run build --prefix client
    staticPublishPath: client/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      # Every page is the same app; let it handle the address.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Where the website finds the game server.
      - key: VITE_API_URL
        fromService:
          name: playverse
          type: web
          property: host
